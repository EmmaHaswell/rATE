<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#970213">
<title>rATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column on warm cream. Illustrated food tiles lead, white cards hold the data, cherry red is reserved for ATE, scores and the Rate action. Single committed light look (brand palette), so no dark variant. */
:root{
  --cream:#FFFDFB; --blue:#AFC6E5; --red:#970213; --ink:#2A2326; --card:#FFFFFF;
  --muted:#6E6366; --line:#ECE3E1; --blue-soft:#E6EDF7; --red-soft:#F3D9DD; --desk:#F0E8E5;
  --display:'Bricolage Grotesque','Avenir Next','Helvetica Neue',Arial,sans-serif;
  --body:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{max-width:480px;min-height:100vh;margin:0 auto;padding-block:12px 130px;padding-left:var(--gl);padding-right:var(--gr);background:var(--cream);animation:rise .28s ease both}
@media(min-width:560px){body{background:var(--desk)}.app{box-shadow:0 0 0 1px var(--line)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6) rotate(-14deg);opacity:0}70%{transform:scale(1.06) rotate(3deg);opacity:1}100%{transform:none}}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

h1{font:700 32px/1.05 var(--display);letter-spacing:-.03em;margin:0;text-wrap:balance}
h2{font:700 21px/1.15 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font:600 15px/1.25 var(--body);margin:0}
p{margin:0}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.mark{font:800 30px/1 var(--display);letter-spacing:-.045em;display:inline-flex;align-items:baseline}
.mark i{font-style:normal;font-weight:300;margin-right:1px}
.mark b{font-weight:800;color:var(--red);letter-spacing:-.03em}
.mark.lg{font-size:56px}
.tagline{font:500 12.5px/1 var(--body);color:var(--muted);letter-spacing:.01em}

.ic{width:22px;height:22px;flex:none}
.ic.on{fill:currentColor}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 16px}
.top .brand{display:flex;flex-direction:column;gap:5px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;background:var(--blue-soft);font:600 12.5px var(--body)}
.pill .ic{width:15px;height:15px}
.pill.campus{background:#DCEBDD;color:#1F5B34}
.demo{display:inline-block;padding:2px 7px;border-radius:99px;background:var(--blue);font:700 9.5px/1.4 var(--body);letter-spacing:.07em;text-transform:uppercase;vertical-align:middle}
.note{background:var(--blue-soft);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font:600 15px var(--body);transition:transform .15s,background .15s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--red);color:#fff}
.btn.ghost{background:var(--card);border:1.5px solid var(--ink)}
.btn.soft{background:var(--blue-soft)}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn[disabled]{opacity:.4;pointer-events:none}
.linkbtn{font-weight:600;text-decoration:underline;text-underline-offset:3px}

.sec{margin-top:30px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sechead .tag{font-size:12px;color:var(--muted)}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:2px var(--gr) 4px var(--gl)}
.hs::-webkit-scrollbar{display:none}
.hs>*{scroll-snap-align:start}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font:500 13.5px var(--body);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--blue);border-color:var(--blue);font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
[data-a]{cursor:pointer}
.thumb{position:relative;aspect-ratio:1/1.05;overflow:hidden;border-radius:16px;margin:6px 6px 0}
.plate img{display:block;width:100%;height:100%;object-fit:cover}
.thumb img,.cover img,.hero img,.rthumb img{display:block;width:100%;height:100%;object-fit:cover}
.cap{position:absolute;right:8px;bottom:8px;max-width:calc(100% - 96px);background:rgba(255,255,255,.92);font:600 11.5px/1.25 var(--body);padding:4px 10px;border-radius:99px;text-align:center}
.hero .cap{left:12px;right:auto;bottom:12px;max-width:calc(100% - 24px)}
.thumb svg,.rphoto svg,.rthumb svg,.hero svg,.mini svg{display:block;width:100%;height:100%}
.score{position:absolute;left:8px;bottom:8px;background:#fff;color:var(--red);font:700 13px var(--body);padding:3px 9px;border-radius:99px;font-variant-numeric:tabular-nums}
.rankb{position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;font:700 11.5px var(--body);padding:3px 8px;border-radius:99px}
.save{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.save .ic{width:18px;height:18px}
.save.on{color:var(--red)}
.meta{padding:10px 14px 14px}
.meta h3{margin-bottom:3px}
.meta p{font-size:13px;color:var(--muted)}
.wcard{width:232px;flex:none}
.wcard .thumb{aspect-ratio:4/3}
.wcard .when{font:600 10.5px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.dcard{width:164px;flex:none}
.masonry{columns:2;column-gap:12px}
.masonry .card{break-inside:avoid;margin-bottom:12px;display:block}
.masonry .card:nth-child(3n+2) .thumb{aspect-ratio:1/1.22}
.masonry .card:nth-child(3n) .thumb{aspect-ratio:1/.92}

.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.row .rk{font:700 18px var(--display);width:22px;text-align:center;color:var(--muted);flex:none}
.rthumb{width:56px;height:56px;border-radius:14px;overflow:hidden;flex:none}
.rmeta{min-width:0;flex:1}
.rmeta h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta p{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rscore{font:700 17px var(--display);color:var(--red);font-variant-numeric:tabular-nums}
.pcard{display:block;position:relative}
.pcard .cover{aspect-ratio:16/9;margin:6px 6px 0;border-radius:16px;overflow:hidden;position:relative}
.pcard .cover svg{width:100%;height:100%;display:block}

.quick{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:14px 16px;border-radius:22px;background:var(--red);color:#fff}
.quick strong{font:700 19px/1.1 var(--display);letter-spacing:-.02em;display:block}
.quick span.s{font-size:13px;opacity:.88}
.quick .ic{width:26px;height:26px}

.searchbar{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.searchbar input{flex:1;min-width:0;border:0;outline:0;background:transparent}
.searchbar:focus-within{border-color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#F1EAE7;border-radius:999px;padding:4px}
.seg button{min-height:38px;border-radius:999px;font-weight:600;text-align:center}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(42,35,38,.12)}
.filters{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:14px}
.filters .eyebrow{margin-bottom:8px;display:block}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}

.rv{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rv .hd{display:flex;align-items:center;gap:10px}
.rv .who{min-width:0;flex:1}
.rv .who b{font-weight:600}
.rv .who p{font-size:12px;color:var(--muted)}
.rv .tg{font-size:14px}
.rv .tg a{font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.rv .scorep{background:var(--red-soft);color:var(--red);font:700 15px var(--display);padding:4px 11px;border-radius:99px;font-variant-numeric:tabular-nums}
.rphoto{border-radius:14px;overflow:hidden;aspect-ratio:16/10;position:relative;background:var(--line)}
.rphoto img{width:100%;height:100%;object-fit:cover;display:block}
.samp{position:absolute;right:8px;bottom:8px;background:rgba(255,255,255,.9);font:600 10px var(--body);padding:2px 7px;border-radius:99px}
.rv .ft{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px}
.like,.flagb,.mini-act{display:inline-flex;align-items:center;gap:6px;min-height:32px}
.like .ic,.flagb .ic,.mini-act .ic{width:18px;height:18px}
.like.on{color:var(--red)}
.rv .sp{flex:1}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;font:700 15px var(--display);flex:none;color:var(--ink)}
.av img{width:100%;height:100%;object-fit:cover}
.vis{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.vis .ic{width:14px;height:14px}

.hero{aspect-ratio:4/3;border-radius:26px;overflow:hidden;position:relative}
.hero .save{width:40px;height:40px}
.scorebig{display:flex;align-items:baseline;gap:6px}
.scorebig b{font:800 58px/1 var(--display);letter-spacing:-.04em;color:var(--red);font-variant-numeric:tabular-nums}
.scorebig span{color:var(--muted);font-weight:500}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px}
.fact b{font-weight:700}
.frs{display:flex;flex-direction:column;gap:8px}
.fr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px}
.fr span.n{flex:1;min-width:0;font-weight:500}
.fr b{color:var(--red);font:700 16px var(--display)}
.photos{display:flex;gap:10px}
.photos .mini{width:112px;height:112px;border-radius:16px;overflow:hidden;flex:none;position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}

.empty{text-align:center;padding:34px 18px;background:var(--card);border:1px dashed #DDD0CF;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{font:700 18px var(--display)}
.empty p{color:var(--muted);font-size:14px;max-width:30ch}
.sk{background:linear-gradient(90deg,#F1EAE7 25%,#FAF6F3 50%,#F1EAE7 75%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:16px}

.nav{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px var(--gr) calc(8px + env(safe-area-inset-bottom,0px)) var(--gl);background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;font:600 11px var(--body);color:var(--muted);text-align:center}
.nav button.on{color:var(--ink)}
.nav button.on .ic{color:var(--red)}
.nav .rate{margin-top:-30px}
.nav .rate .disc{width:60px;height:60px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;border:4px solid var(--cream);box-shadow:0 8px 20px rgba(151,2,19,.32)}
.nav .rate .ic{width:28px;height:28px;color:#fff}
.nav .rate.on .ic{color:#fff}
.nav .rate span.l{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font:500 13.5px var(--body);z-index:40;animation:rise .2s ease both;text-align:center}
.scrim{position:fixed;inset:0;background:rgba(42,35,38,.42);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;background:var(--card);border-radius:26px 26px 0 0;padding:22px var(--gr) calc(22px + env(safe-area-inset-bottom,0px)) var(--gl);z-index:51;animation:rise .22s ease both;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin-bottom:4px}
.sheet .opt{min-height:50px;border:1px solid var(--line);border-radius:16px;padding:0 16px;display:flex;align-items:center;font-weight:500}

.rhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.prog{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .3s ease}
.stepn{font:600 12px var(--body);color:var(--muted);width:28px;text-align:right}
.choice{display:flex;align-items:center;gap:14px;padding:12px;border:1.5px solid var(--line);background:var(--card);border-radius:22px;width:100%}
.choice .rthumb{width:76px;height:76px;border-radius:18px}
.choice h3{font:700 19px var(--display);letter-spacing:-.02em;margin-bottom:2px}
.choice p{font-size:13px;color:var(--muted)}
.choice.on{border-color:var(--ink);background:var(--blue-soft)}
.bignum{font:800 92px/1 var(--display);letter-spacing:-.05em;color:var(--red);text-align:center;font-variant-numeric:tabular-nums}
.word{text-align:center;font:600 15px var(--body);color:var(--muted);min-height:22px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;background:linear-gradient(to right,var(--red) var(--pct,66%),var(--line) var(--pct,66%));outline-offset:6px;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--red);box-shadow:0 2px 8px rgba(42,35,38,.2)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--red)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stepper{display:flex;justify-content:center;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:600 13px var(--body)}
.input,.textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;outline:0}
.input:focus,.textarea:focus{border-color:var(--ink)}
.textarea{min-height:110px;resize:vertical}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;border:1.5px dashed #D6C9C8;border-radius:20px;background:var(--card);color:var(--muted);cursor:pointer;text-align:center;padding:14px}
.drop img{width:100%;max-height:260px;object-fit:cover;border-radius:14px}
.make{display:flex;align-items:center;gap:14px;width:100%;margin:16px 0 4px;padding:12px;border-radius:22px;border:1.5px dashed var(--red);background:var(--red-soft);text-align:left}
.make .rthumb{width:64px;height:64px;border-radius:18px}
.make h3{font:700 18px var(--display);letter-spacing:-.02em;margin-bottom:2px}
.make p{font-size:13px;color:var(--muted)}
.err{color:var(--red);font-size:13px;font-weight:500}
.sum{display:flex;flex-direction:column;gap:12px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:10px}
.done .plate{width:190px;height:190px;border-radius:50%;overflow:hidden;animation:pop .6s cubic-bezier(.2,1.2,.4,1) both;box-shadow:0 14px 30px rgba(42,35,38,.14)}
.done h1{font-size:38px}
.done h1 em{font-style:normal;color:var(--red)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle input{width:22px;height:22px;accent-color:var(--red);flex:none}

.phead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.phead .av{margin-bottom:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 6px;text-align:center}
.stats b{display:block;font:700 20px var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats span{font-size:11.5px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:2px var(--gr) 2px var(--gl)}
.tabs::-webkit-scrollbar{display:none}
.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--red-soft);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:500}
.strip{display:flex;gap:14px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;font-size:12px;font-weight:500;text-align:center}
.strip span.h{max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:12px}
</style>

</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav" aria-label="Main">
  <button data-a="navTo" data-v="home" data-tab="home"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>Home</span></button>
  <button data-a="navTo" data-v="explore" data-tab="explore"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span>Explore</span></button>
  <button class="rate" data-a="navTo" data-v="rate" data-tab="rate"><span class="disc"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="l">Rate</span></button>
  <button data-a="navTo" data-v="friends" data-tab="friends"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><path d="M16 5.5a3 3 0 0 1 0 6"/><path d="M18 14.3c1.6.6 2.7 2.1 3 4.7"/></svg><span>Friends</span></button>
  <button data-a="navTo" data-v="profile" data-tab="profile"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.7-4 3.6-6 7-6s6.3 2 7 6"/></svg><span>Profile</span></button>
</nav>
<div id="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   DEMONSTRATION DATA. Ratings, reviews, "students" and daily availability are made up for the
   prototype. Davis Cafe dish names, descriptions and hours come from its published menu. Edit freely.

async function loadLiveMenu(){
 if(LIVE.status==='off')return;
 const H={apikey:CFG.anonKey,Authorization:'Bearer '+CFG.anonKey};
 try{
  const day=todayISO();
  const [m,r]=await Promise.all([
   fetch(`${CFG.supabaseUrl}/rest/v1/daily_menu?select=location_id,meal,station,dishes(id,name,category)&menu_date=eq.${day}&order=meal.asc,station.asc`,{headers:H}),
   fetch(`${CFG.supabaseUrl}/rest/v1/menu_sync_runs?select=finished_at&status=eq.ok&order=finished_at.desc&limit=1`,{headers:H})
  ]);
  if(!m.ok)throw new Error('menu '+m.status);
  const rows=await m.json(),runs=r.ok?await r.json():[];
  LIVE.rows={};
  rows.forEach(x=>{if(!x.dishes||!PLACE[x.location_id])return;(LIVE.rows[x.location_id]=LIVE.rows[x.location_id]||[]).push({d:liveDish(x.location_id,x.dishes.name,x.station||x.dishes.category,x.dishes.id),meal:x.meal||'Today'})});
  LIVE.day=day;LIVE.updated=runs[0]?new Date(runs[0].finished_at):null;LIVE.status='ok';
 }catch(e){LIVE.status='error'}
}
const isLive=id=>LIVE.status==='ok'&&LIVE_PLACES.includes(id);
function todayMenu(){
 const rot=MENUS[dayOfYear()%3],out=[];
 PLACES.forEach(p=>{
  if(isLive(p.id)){(LIVE.rows[p.id]||[]).forEach(x=>out.push({d:x.d,loc:p.id,meal:x.meal,live:true}));return}
  rot.filter(m=>m.loc===p.id).forEach(m=>m.dishes.forEach(id=>out.push({d:DISH[id],loc:p.id,meal:m.meal})));
 });
 return out;
}

  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('decode'));im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=fr.result};
  fr.readAsDataURL(file);
 });
}

function exploreItems(){
 const E=S.ui.ex,q=E.q.trim().toLowerCase();let items;
 if(E.mode==='dishes'){
  items=DISHES.map(d=>Object.assign({d},agg('dish',d.id))).filter(x=>(!q||(x.d.name+' '+PLACE[x.d.place].name+' '+x.d.cat).toLowerCase().includes(q))&&(E.loc==='all'||x.d.place===E.loc)&&(E.cat==='all'||x.d.cat===E.cat)&&x.avg>=E.min);
  if(E.sort==='saved')items=items.filter(x=>S.saved.has('dish:'+x.d.id));
  items.sort(E.sort==='trend'?(a,b)=>b.d.trend-a.d.trend:E.sort==='reviewed'?(a,b)=>b.n-a.n:(a,b)=>b.avg-a.avg||b.n-a.n);
 }else{
  items=placeList().filter(x=>(!q||(x.p.name+' '+x.p.type).toLowerCase().includes(q))&&(E.cat==='all'||x.p.type===E.cat)&&x.avg>=E.min);
  if(E.sort==='saved')items=items.filter(x=>S.saved.has('place:'+x.p.id));
  items.sort(E.sort==='trend'?(a,b)=>b.p.trend-a.p.trend:E.sort==='reviewed'?(a,b)=>b.n-a.n:(a,b)=>b.avg-a.avg||b.n-a.n);
 }
 return items;
}

/* ---- Rate flow ---- */
const WORDS=[[3,'skip it'],[5,'meh'],[6.5,'fine'],[8,'good'],[9,'great'],[10.1,'crave-worthy']];
const wordFor=s=>WORDS.find(w=>s<w[0])[1];
const pctOf=s=>((s-1)/9*100).toFixed(1)+'%';
function rateResultsHTML(){
 const R=S.rate,q=R.q.trim().toLowerCase();
 if(R.type==='dish'){
  const l=dishList().filter(x=>!q||(x.d.name+' '+PLACE[x.d.place].name).toLowerCase().includes(q)).slice(0,12);
  const mine=Object.values(S.custom).filter(c=>!q||(c.name+' '+PLACE[c.place].name).toLowerCase().includes(q));
  if(!l.length&&!mine.length)return emptyBlock('No dish found','Check the spelling, or try the dining location name.');
  return `<div class="list">${mine.map(c=>`<button class="row" data-a="ratePick" data-v="${c.id}"><div class="rthumb">${artD(c)}</div><div class="rmeta"><h3>${esc(c.name)}</h3><p>Your creation · ${esc(PLACE[c.place].name)}</p></div><span class="rscore">${fmt(agg('dish',c.id).avg)}</span></button>`).join('')}${l.map(x=>`<button class="row" data-a="ratePick" data-v="${x.d.id}"><div class="rthumb">${artD(x.d)}</div><div class="rmeta"><h3>${esc(x.d.name)}</h3><p>${esc(PLACE[x.d.place].name)}</p></div><span class="rscore">${fmt(x.avg)}</span></button>`).join('')}</div>`;
 }
 const l=placeList().filter(x=>!q||(x.p.name+' '+x.p.type).toLowerCase().includes(q));
 if(!l.length)return emptyBlock('No place found','Try a different name.');
 return `<div class="list">${l.map(x=>`<button class="row" data-a="ratePick" data-v="${x.p.id}"><div class="rthumb">${artP(x.p)}</div><div class="rmeta"><h3>${esc(x.p.name)}</h3><p>${esc(x.p.type)}</p></div><span class="rscore">${fmt(x.avg)}</span></button>`).join('')}</div>`;
}
function rateDone(){
 const R=S.rate,dn=R.done,rv=S.reviews.find(r=>r.id===dn.id),t=item(rv.type,rv.target),a=agg(rv.type,rv.target);
 const cust=!!t.custom;
 const rk=cust?'':rv.type==='dish'?`#${rankOf(dishList(t.place),t.id)} at ${PLACE[t.place].name}`:`#${rankOf(placeList(),t.id)} of ${PLACES.length} places`;
 return `<div class="done"><div class="plate">${rv.type==='dish'?artD(t):artP(t)}</div>
 <h1>${dn.editing?'you ate. you <em>re-rated.</em>':'you ate. you <em>rated.</em>'}</h1>
 <div class="facts" style="justify-content:center"><span class="fact">Your score <b class="num">${fmt(rv.rating)}</b></span><span class="fact">${esc(t.name)}</span></div>
 <p class="muted" style="max-width:32ch">${cust?'Saved to your profile as your own creation. It does not count toward campus rankings.':rv.pub?`Campus average is now <b class="num">${fmt(a.avg)}</b>, ranked ${rk}.`:'Saved privately. Only you can see it, and it does not count toward campus rankings.'}</p>
 <div style="display:flex;flex-direction:column;gap:10px;width:100%;margin-top:8px"><button class="btn primary full" data-a="go" data-v="${rv.type}-${t.id}">See ${esc(t.name)}</button><button class="btn ghost full" data-a="rateAgain">Rate another</button><button class="btn soft full" data-a="rateFinish" data-v="profile">View my profile</button></div></div>`;
}

/* ===================== router / render ===================== */
function route(){
 const h=(location.hash||'#home').slice(1);
 const m=h.match(/^(dish|place|user)-([a-z0-9]+)$/);
 if(m)return {name:m[1],id:m[2]};
 if(TABS.includes(h)||h==='edit-profile')return {name:h};
 return {name:'notfound'};
}
function render(){
 const r=route(),key=location.hash||'#home';
 const isTab=TABS.includes(r.name);
 if(isTab)S.lastTab=r.name;else if(r.name==='edit-profile')S.lastTab='profile';
 if(isTab)S.stack=[key];
 else if(S.popping)S.popping=false;
 else if(S.stack[S.stack.length-2]===key)S.stack.pop();
 else if(S.stack[S.stack.length-1]!==key)S.stack.push(key);
 const y=window.scrollY,same=S.key===key;
 const fn=screens[r.name]||screens.notfound;
 const app=$('#app');
 app.innerHTML=fn(r);
 if(!same){app.style.animation='none';void app.offsetWidth;app.style.animation='';window.scrollTo(0,0)}else window.scrollTo(0,y);
 S.key=key;
 const tab=isTab?r.name:S.lastTab;
 $$('#nav [data-tab]').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 document.documentElement.setAttribute('data-route',r.name);
}
function go(v){if(location.hash==='#'+v)render();else location.hash=v}
function closeSheet(){const s=$('#sheet');s.hidden=true;s.innerHTML=''}
function openSheet(html){const s=$('#sheet');s.innerHTML=`<div class="scrim" data-a="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false}
function syncSave(key){
 const on=S.saved.has(key);
 $$(`[data-a="save"][data-v="${key}"]`).forEach(b=>{
  if(b.classList.contains('save')){b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Remove from saved':'Save');const i=b.querySelector('.ic');if(i)i.classList.toggle('on',on)}
  else if(b.dataset.x)b.textContent=on?'Saved':'Save';
 });
}
function loadEdit(rv){
 S.rate=Object.assign(freshRate(),{step:3,type:rv.type,target:rv.target,score:rv.rating,text:rv.text||'',photo:rv.photo,pub:rv.pub,editing:rv.id});
}

const A={
 go:v=>go(v),
 navTo:v=>{if(v==='rate'&&S.rate.done)S.rate=freshRate();go(v)},
 back:()=>{if(S.stack.length>1){S.stack.pop();S.popping=true;location.hash=S.stack[S.stack.length-1]}else go(S.lastTab||'home')},
 save:v=>{if(S.saved.has(v)){S.saved.delete(v);toast('Removed from Want to Try')}else{S.saved.add(v);toast('Saved to Want to Try')}syncSave(v)},
 like:v=>{
  if(S.likes.has(v))S.likes.delete(v);else S.likes.add(v);
  const rv=S.reviews.find(r=>r.id===v),on=S.likes.has(v);
  $$(`[data-a="like"][data-v="${v}"]`).forEach(b=>{b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.querySelector('.ic').classList.toggle('on',on);b.querySelector('span').textContent=rv.likes+(on?1:0)});
 },
 follow:v=>{
  const u=USERS[v];if(S.follows.has(v)){S.follows.delete(v);toast('Unfollowed '+u.name)}else{S.follows.add(v);toast('Following '+u.name)}
  const f=S.follows.has(v);
  $$(`[data-a="follow"][data-v="${v}"]`).forEach(b=>{b.textContent=f?'Following':'Follow';b.classList.toggle('ghost',f);b.classList.toggle('primary',!f)});
  if(route().name==='friends'&&!S.ui.fq)render();
 },
 homeLoc:v=>{S.ui.homeLoc=v;render()},
 exploreGo:v=>{const E=S.ui.ex;if(v==='trend'){E.mode='dishes';E.sort='trend'}else{E.mode='places';E.sort='top'}E.cat='all';E.loc='all';E.min=0;E.q='';go('explore')},
 exMode:v=>{const E=S.ui.ex;E.mode=v;E.cat='all';E.loc='all';render()},
 exSort:v=>{S.ui.ex.sort=v;render()},
 exFilters:()=>{S.ui.ex.open=!S.ui.ex.open;render()},
 exCat:v=>{S.ui.ex.cat=v;render()},
 exMin:v=>{S.ui.ex.min=+v;render()},
 exLoc:v=>{S.ui.ex.loc=v;S.ui.ex.cat='all';render()},
 exClear:()=>{const E=S.ui.ex;E.q='';E.cat='all';E.min=0;E.loc='all';render()},
 feedTab:v=>{S.ui.feed=v;S.ui.fq='';render()},
 profTab:v=>{S.ui.prof=v;S.ui.confirmDel=null;render()},
 reportOpen:v=>openSheet(`<h2>Report this review</h2><p class="muted small">Tell us what is wrong. You will not see it again.</p>${['Spam or ads','Abusive or inappropriate','Not about this food','Something else'].map(x=>`<button class="opt" data-a="report" data-v="${v}|${x}">${x}</button>`).join('')}<button class="btn ghost" data-a="closeSheet">Cancel</button>`),
 report:v=>{const id=v.split('|')[0];S.reported.add(id);closeSheet();toast('Reported. Thanks for keeping rATE kind.');render()},
 closeSheet:()=>closeSheet(),
 /* rate flow */
 rateType:v=>{S.rate=Object.assign(freshRate(),{step:2,type:v});render()},
 rateCustom:()=>{const R=S.rate;R.custom=true;R.cname='';R.cplace='';R.photo=null;S.ui.photoErr='';render()},
 ratePick:v=>{
  const R=S.rate,ex=myReview(R.type,v);
  if(ex){loadEdit(ex);toast('You rated this already. Editing your rating.')}else{R.target=v;R.step=3;R.score=8;R.text='';R.photo=null;R.pub=S.me.defPub;R.editing=null;R.custom=false}
  render();
 },
 rateFor:v=>{const [t,id]=v.split(':'),ex=myReview(t,id);if(ex)loadEdit(ex);else S.rate=Object.assign(freshRate(),{step:3,type:t,target:id});S.ui.photoErr='';go('rate')},
 rateEdit:v=>{const rv=S.reviews.find(r=>r.id===v);loadEdit(rv);S.ui.photoErr='';go('rate')},
 rateStep:v=>{S.rate.step=+v;S.ui.photoErr='';render()},
 rateBack:()=>{
  const R=S.rate;
  if(R.done){A.rateFinish('home');return}
  if(R.editing&&R.step<=3){S.rate=freshRate();A.back();return}
  if(R.step>1){R.step-=1;if(R.step===2){R.target=null}render()}else go('home');
 },
 rateAdj:v=>{const R=S.rate;R.score=Math.min(10,Math.max(1,Math.round((R.score+ +v)*10)/10));setScore(R.score,true)},
 rateVis:v=>{S.rate.pub=v==='1';render()},
 photoRemove:()=>{S.rate.photo=null;render()},
 rateSubmit:()=>{
  const R=S.rate;let id;
  if(R.editing){const rv=S.reviews.find(r=>r.id===R.editing);Object.assign(rv,{rating:R.score,text:R.text.trim(),photo:R.photo,pub:R.pub,ts:Date.now()});delete rv.sample;id=rv.id;if(S.custom[rv.target])S.custom[rv.target].photo=R.photo}
  else{if(R.custom){const cid='c'+Date.now();S.custom[cid]={id:cid,custom:true,place:R.cplace,name:R.cname.trim(),cat:'Make your own',kind:'plate',bg:'sand',photo:R.photo,avg:0,n:0,trend:0,blurb:'Your own creation.'};R.target=cid;R.custom=false}
  id='m'+Date.now();S.reviews.push({id,user:'me',type:R.type,target:R.target,rating:R.score,text:R.text.trim(),photo:R.photo,pub:R.pub,ts:Date.now(),likes:0})}
  R.done={id,editing:!!R.editing};render();
 },
 rateAgain:()=>{S.rate=freshRate();render()},
 rateFinish:v=>{S.rate=freshRate();go(v)},
 delAsk:v=>{S.ui.confirmDel=v;render()},
 delCancel:()=>{S.ui.confirmDel=null;render()},
 delDo:v=>{S.reviews=S.reviews.filter(r=>r.id!==v);Object.keys(S.custom).forEach(k=>{if(!S.reviews.some(r=>r.target===k))delete S.custom[k]});S.ui.confirmDel=null;toast('Rating deleted');render()},
 profileSave:()=>{
  const name=$('#pf-name').value.trim(),handle=$('#pf-handle').value.trim().replace(/^@/,''),err=$('#pf-err');
  if(!name){err.textContent='Add a name so friends can find you.';return}
  if(!/^[a-z0-9._]{3,20}$/i.test(handle)){err.textContent='Usernames use 3 to 20 letters, numbers, dots or underscores.';return}
  Object.assign(S.me,{name,handle:handle.toLowerCase(),bio:$('#pf-bio').value.trim(),priv:$('#pf-priv').checked,defPub:$('#pf-def').checked,showAct:$('#pf-act').checked});
  if(S.ui.draftPhoto!==undefined)S.me.photo=S.ui.draftPhoto;
  S.ui.draftPhoto=undefined;toast('Profile saved');go('profile');
 }
};
function setScore(s,sync){
 const n=$('#scoreNum');if(!n)return;
 n.textContent=fmt(s);$('#scoreWord').textContent=wordFor(s);
 const r=$('#score');r.style.setProperty('--pct',pctOf(s));if(sync)r.value=s;
}

/* ===================== events ===================== */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');
 if(!el)return;
 const fn=A[el.dataset.a];
 if(fn){e.preventDefault();fn(el.dataset.v,el,e)}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="link"]')){e.preventDefault();e.target.click()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='q'){S.ui.ex.q=t.value;$('#results').innerHTML=exploreResults()}
 else if(t.id==='rq'){S.rate.q=t.value;$('#rres').innerHTML=rateResultsHTML()}
 else if(t.id==='cname'||t.id==='cplace'){S.rate[t.id==='cname'?'cname':'cplace']=t.value;const n=$('#cnext');if(n)n.disabled=!(S.rate.cname.trim()&&S.rate.cplace)}
 else if(t.id==='fsearch'){S.ui.fq=t.value;const had=!!$('#fpanel .seg');if(S.ui.fq.trim()||had)$('#fpanel').innerHTML=screensFriendsPanel()}
 else if(t.id==='score'){S.rate.score=Math.round(+t.value*10)/10;setScore(S.rate.score,false)}
 else if(t.id==='rtext'){S.rate.text=t.value;$('#rcount').textContent=t.value.length+'/280'}
});
function screensFriendsPanel(){
 const fq=S.ui.fq.trim();
 if(fq)return peopleHTML();
 const html=screens.friends();const d=document.createElement('div');d.innerHTML=html;return d.querySelector('#fpanel').innerHTML;
}
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='cplace'){S.rate.cplace=t.value;const n=$('#cnext');if(n)n.disabled=!(S.rate.cname.trim()&&S.rate.cplace);return}
 if(t.id==='photo'||t.id==='cphoto'){
  S.ui.photoErr='';
  processPhoto(t.files[0],900).then(url=>{S.rate.photo=url;render()}).catch(er=>{S.ui.photoErr=er.message==='size'?'That photo is over 12 MB. Try a smaller one.':er.message==='type'?'Choose an image file (JPG or PNG).':'We could not read that photo. Try another one.';render()});
 }else if(t.id==='avatar'){
  processPhoto(t.files[0],360).then(url=>{S.ui.draftPhoto=url;$('#avprev').innerHTML=avatar({name:$('#pf-name').value||'?',photo:url,color:'#AFC6E5'},92)}).catch(()=>{$('#pf-err').textContent='We could not read that photo. Try a JPG or PNG.'});
 }
});
window.addEventListener('hashchange',render);

/* ===================== boot ===================== */
render();
setTimeout(()=>{S.loading=false;render()},550);
loadLiveMenu().then(()=>render());
})();
</script>

</body>
